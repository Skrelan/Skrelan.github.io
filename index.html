.glass-nav {
  position: fixed;
  top: 18px;
  left: 50%;
  transform: translateX(-50%) translateY(-18px) scale(0.96);
  z-index: 1000;
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: center;
  align-items: center;
  width: fit-content;
  max-width: min(94vw, 1080px);
  margin: 18px auto 0;

  border: 1px solid rgba(255, 255, 255, 0.58);
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.68);
  box-shadow: 0 18px 40px rgba(15, 23, 42, 0.10);
  backdrop-filter: blur(18px) saturate(160%);

  overflow-x: auto;
  overflow-y: hidden;
  white-space: nowrap;
  scrollbar-width: none;
  opacity: 0;
  pointer-events: none;
  transition: opacity 220ms ease, transform 220ms ease, box-shadow 220ms ease;
}

.glass-nav::-webkit-scrollbar {
  display: none;
}

.glass-nav-indicator {
  position: absolute;
  top: 0;
  left: 0;
  border: 1px solid rgba(255, 255, 255, 0.72);
  border-radius: 999px;
  background:
    radial-gradient(120% 140% at 50% -28%, rgba(255, 232, 164, 0.9), rgba(255, 232, 164, 0.28) 34%, rgba(255, 247, 225, 0.16) 56%, rgba(255, 247, 225, 0) 74%),

    inset 0 1px 0 rgba(255, 255, 255, 0.9),
    inset 0 18px 24px rgba(255, 233, 178, 0.34),
    inset 0 -8px 16px rgba(255, 255, 255, 0.18),
    0 10px 24px rgba(15, 23, 42, 0.10),
    0 -6px 18px rgba(255, 221, 140, 0.30),
    0 0 0 1px rgba(227, 184, 92, 0.18),
    0 12px 34px rgba(227, 184, 92, 0.14);
  backdrop-filter: blur(14px) saturate(180%);
  -webkit-backdrop-filter: blur(14px) saturate(180%);
  transition: transform 260ms cubic-bezier(0.22, 1, 0.36, 1), width 260ms cubic-bezier(0.22, 1, 0.36, 1), height 260ms cubic-bezier(0.22, 1, 0.36, 1), opacity 180ms ease;

}

}

.glass-nav a:hover,
.glass-nav a:focus-visible {

    <script>
      (function () {
        var heroSection = document.getElementById('sec-b6ba');
        var nav = document.querySelector('.glass-nav');
        var navLinks = nav ? Array.prototype.slice.call(nav.querySelectorAll('a')) : [];
        var indicator = nav ? nav.querySelector('.glass-nav-indicator') : null;

        function updateIndicator(activeLink) {
          if (!nav || !indicator || !activeLink) {
            return;
          }

          navLinks.forEach(function (link) {
            link.classList.toggle('is-active', link === activeLink);
          });

          indicator.style.width = activeLink.offsetWidth + 'px';
          indicator.style.height = activeLink.offsetHeight + 'px';
          indicator.style.transform =
            'translate(' + activeLink.offsetLeft + 'px, ' + activeLink.offsetTop + 'px)';

          if (nav.scrollWidth > nav.clientWidth) {
            activeLink.scrollIntoView({
              behavior: 'auto',
              block: 'nearest',
              inline: 'center'
            });
          }
        }

        if (navLinks.length) {
          updateIndicator(navLinks[0]);
          window.addEventListener('resize', function () {
            var current = nav.querySelector('a.is-active') || navLinks[0];
            updateIndicator(current);
          });
        }

        if (!heroSection || !('IntersectionObserver' in window)) {
          document.body.classList.add('show-glass-nav');
          if (navLinks.length) {
            updateIndicator(navLinks[0]);
          }
          return;
        }

        var heroObserver = new IntersectionObserver(
          function (entries) {
            var entry = entries[0];
            document.body.classList.toggle('show-glass-nav', !entry.isIntersecting);
          },
          {
            threshold: 0.2
          }
        );

        heroObserver.observe(heroSection);

        var trackedSections = navLinks
          .map(function (link) {
            var section = document.querySelector(link.getAttribute('href'));
            return section
              ? {
                  link: link,
                  section: section
                }
              : null;
          })
          .filter(Boolean);

        var ticking = false;

        function updateActiveSection() {
          if (!trackedSections.length) {
            return;
          }

          var viewportTarget = window.innerHeight * 0.42;
          var bestMatch = trackedSections
            .map(function (item) {
              var rect = item.section.getBoundingClientRect();
              var sectionMidpoint = rect.top + rect.height / 2;
              var distance = Math.abs(sectionMidpoint - viewportTarget);

              return {
                link: item.link,
                distance: distance
              };
            })
            .sort(function (a, b) {
              return a.distance - b.distance;
            })[0];

          if (bestMatch && bestMatch.link) {
            updateIndicator(bestMatch.link);
          }
        }

        function requestActiveSectionUpdate() {
          if (ticking) {
            return;
          }

          ticking = true;
          window.requestAnimationFrame(function () {
            updateActiveSection();
            ticking = false;
          });
        }

        navLinks.forEach(function (link) {
          link.addEventListener('click', function () {
            updateIndicator(link);
          });
        });

        updateActiveSection();
        window.addEventListener('scroll', requestActiveSectionUpdate, { passive: true });
        window.addEventListener('resize', requestActiveSectionUpdate);
      })();
    </script>
